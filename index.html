<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactief verticaal telraam</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f7f7f4;color:#1f2937}
#app{max-width:1780px;margin:0 auto;padding:22px 28px}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.sumrow{display:grid;grid-template-columns:minmax(260px,1fr) auto minmax(260px,1fr) auto;gap:14px;align-items:end;margin-bottom:18px}
label{font-size:18px;font-weight:800;display:flex;flex-direction:column;gap:7px}
#first,#second{font-size:34px;font-weight:900;min-height:64px}
input,button,select{font:inherit;min-height:52px;padding:11px 16px;border-radius:11px;border:2px solid #cfcfc8;background:#fff;color:#1f2937}
select{font-size:20px;font-weight:800;cursor:pointer}.level-label{font-size:16px;gap:5px}
button{cursor:pointer;font-size:20px;font-weight:800}
.operator{font-size:38px;font-weight:900;padding-bottom:8px}
.valuebox{font-size:34px;font-weight:900;margin-left:auto}
.board{background:#f2c66d;border:14px solid #8b572a;border-radius:18px;padding:16px;overflow:hidden;box-shadow:inset 0 0 0 3px #5d351a;min-width:0}
.headings,.columns{display:grid;grid-template-columns:repeat(6,minmax(82px,1fr));gap:10px;min-width:0}
.headings{margin-bottom:8px}
.heading{font-weight:900;font-size:26px;text-align:center;color:#3d2516;line-height:34px}
.col{display:flex;flex-direction:column;align-items:center;gap:9px}
.rod{position:relative;height:455px;width:78px;display:flex;flex-direction:column;align-items:center;padding:8px 0}
.rod::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:5px;transform:translateX(-50%);background:linear-gradient(#a9adb1,#70757a,#a9adb1);border-radius:3px;z-index:0}
.group{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.spacer{flex:1 1 auto;min-height:16px}
.bead{appearance:none;-webkit-appearance:none;width:64px;height:17px;min-height:17px;padding:0;border-radius:9px;border:2px solid rgba(70,45,25,.65);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14);cursor:pointer;position:relative}
.bead::after{content:"";position:absolute;width:7px;top:-2px;bottom:-2px;left:50%;transform:translateX(-50%);background:transparent;border-left:0;border-right:0}
.bead.inactive{opacity:.35}.bead.active{opacity:1;z-index:5}
.count{margin-top:8px;font-size:30px;font-weight:900}
.legend{margin-top:14px;padding:10px 14px;border-radius:10px;background:#fff7df;border:1px solid #d8b66b;text-align:center;font-size:14px;font-weight:700;color:#3d2516;line-height:1.5}
.estimate{margin-top:14px;padding:14px;border-radius:12px;background:#e6f5ff;border:1px solid #9bc9e8}
.estimate-title{font-weight:800;margin-bottom:8px}
.estimate-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.estimate-sum{font-size:22px;font-weight:800;min-width:180px;padding-bottom:8px}
.estimate input{font:inherit;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #9bc9e8;background:#fff;color:#1f2937;width:150px}
.estimate input.correct{border-color:#2e7d32;background:#e8f5e9}
.estimate input.wrong{border-color:#c62828;background:#ffebee}
.estimate-feedback{font-size:14px;font-weight:700;min-height:20px;margin-top:8px}
.help{margin-top:16px;font-size:14px;color:#5f5f59;line-height:1.5}

.vertical-work{padding:22px 20px;border-radius:16px;background:#fff;border:3px solid #334155;display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.vertical-work-title{font-weight:900;margin-bottom:16px;font-size:27px;text-align:center}
.column-sum{display:grid;grid-template-columns:52px repeat(6,minmax(48px,1fr));gap:5px;justify-content:center;align-items:center;font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums;font-size:50px;font-weight:900;width:100%;max-width:570px;margin:0 auto}
.column-sum .cell{height:64px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.column-sum .muted{color:#9ca3af}
.column-sum .exchange{font-size:30px;color:#9a3412;background:#ffedd5;font-weight:900}
.column-sum .opcell{justify-content:center;padding-right:0;font-size:48px}
.column-sum .line{border-top:6px solid #111827;border-radius:0;height:12px}
.column-sum .resultcell{background:#eef2ff;color:#111827}
.column-sum .activeplace{outline:5px solid #2563eb;outline-offset:-3px;background:#dbeafe}
.column-sum .changed{background:#fef3c7}
.column-sum .borrow-replaced{text-decoration-line:line-through;text-decoration-thickness:4px;text-decoration-color:#9a3412;text-decoration-skip-ink:none}
.work-note{margin-top:22px;text-align:center;font-size:30px;font-weight:900;color:#2563eb;min-height:82px;line-height:1.35}
 .main-stage{display:grid;grid-template-columns:minmax(720px,1.55fr) minmax(430px,.85fr);gap:22px;align-items:stretch}
.place-row{display:grid;grid-template-columns:52px repeat(6,minmax(48px,1fr));gap:5px;width:100%;max-width:570px;margin:0 auto 4px;font-size:17px;font-weight:900;color:#475569;text-align:center}
.place-row span:first-child{visibility:hidden}
@media(max-width:1200px){#app{padding:16px}.main-stage{grid-template-columns:1fr}.board{overflow-x:auto}.headings,.columns{min-width:680px}.vertical-work{max-width:760px;width:100%;box-sizing:border-box;margin:0 auto}.rod{height:430px}.column-sum{font-size:46px}}
@media(max-width:700px){#app{padding:12px}.sumrow{grid-template-columns:1fr auto 1fr}.sumrow button{grid-column:1/-1}.valuebox{width:100%;margin-left:0}.column-sum{grid-template-columns:38px repeat(6,minmax(38px,1fr));font-size:34px}.column-sum .cell{height:48px}.column-sum .exchange{font-size:22px}.place-row{grid-template-columns:38px repeat(6,minmax(38px,1fr));font-size:13px}.vertical-work-title{font-size:22px}.work-note{font-size:24px}}


/* === Vormgevingsvoorstel: rustiger, moderner en digibordgericht === */
:root{
  --page:#f4f1ea;
  --surface:#ffffff;
  --ink:#24303f;
  --muted:#64748b;
  --line:#d7dde5;
  --blue:#2563eb;
  --blue-soft:#eaf2ff;
  --sand:#e8c777;
  --wood:#765033;
  --wood-dark:#523721;
  --cream:#fbf5df;
}
body{background:var(--page);color:var(--ink)}
#app{max-width:1780px;padding:20px 28px 24px}

/* Bovenste bediening: minder formulierachtig */
.controls{gap:10px;margin-bottom:12px;align-items:end}
label{font-size:16px;color:#334155;gap:5px}
input,button,select{min-height:46px;border-radius:10px;border:1.5px solid #cbd2dc;background:#fff;box-shadow:none}
button{font-size:18px;font-weight:800;padding:9px 14px;transition:background .15s ease,border-color .15s ease,transform .05s ease}
button:active{transform:translateY(1px)}
#first,#second{font-size:30px;min-height:54px;padding:8px 14px;background:#fff;border-color:#bfc7d2}
.sumrow{grid-template-columns:minmax(250px,1fr) auto minmax(250px,1fr) auto;gap:12px;margin-bottom:12px}
.operator{font-size:42px;color:#334155;padding-bottom:3px}
.valuebox{font-size:25px;color:#334155;padding-bottom:8px}
.level-label{font-size:14px}.level-label select{font-size:17px;min-height:46px}

/* Knoppen krijgen duidelijke hiërarchie */
#next{background:var(--blue);border-color:var(--blue);color:white;padding-left:18px;padding-right:18px}
#back{border-color:#9fb3cf;color:#274563;background:#fff}
#plus,#minus{background:#fff;border-color:#94a3b8;color:#334155}
#plus:focus,#minus:focus,#back:focus,#next:focus,#sumform button:focus,#random:focus,#reset:focus{outline:3px solid rgba(37,99,235,.22);outline-offset:2px}
#sumform button{background:#1f2937;border-color:#1f2937;color:#fff}
#reset{color:#64748b;background:#fafafa}
#random{background:#fff;border-color:#94a3b8}

/* Hoofdvlak */
.main-stage{gap:18px}
.board{background:var(--sand);border:9px solid var(--wood);border-radius:16px;padding:15px;box-shadow:inset 0 0 0 2px var(--wood-dark),0 2px 5px rgba(51,38,24,.10)}
.heading{color:#422f21;font-size:25px}
.rod::before{background:linear-gradient(#b7bcc2,#7b828b,#b7bcc2)}
.bead{border-color:rgba(64,44,28,.58);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.count{font-size:29px;color:#27313f}

/* Rekenkaart: minder zware rand, meer rust */
.vertical-work{padding:20px 20px 18px;border-radius:16px;background:var(--surface);border:1.5px solid #cfd6df;box-shadow:0 2px 6px rgba(30,41,59,.08)}
.vertical-work-title{font-size:25px;color:#1f2937;margin-bottom:13px}
.place-row{color:#64748b;font-size:16px}
.column-sum{font-size:50px}
.column-sum .cell{height:62px;border-radius:8px}
.column-sum .exchange{font-size:29px;color:#9a3412;background:#fff1e7}
.column-sum .line{border-top:5px solid #202938}
.column-sum .resultcell{background:#f5f7fb;color:#111827}
.column-sum .activeplace{outline:4px solid var(--blue);outline-offset:-2px;background:var(--blue-soft)}
.column-sum .changed{background:#fff5cf}

/* Blauwe uitleg blijft het aandachtspunt */
.work-note{margin-top:19px;padding:10px 12px 2px;text-align:center;font-size:29px;font-weight:900;color:var(--blue);min-height:78px;line-height:1.32}

/* Schatten ondersteunend, niet concurrerend */
.estimate{margin-top:16px;padding:18px 20px;border-radius:14px;background:#eef6ff;border:2px solid #8fb9e8;display:grid;grid-template-columns:auto 1fr;column-gap:24px;align-items:center}
.estimate-title{font-size:24px;font-weight:900;margin:0;color:#1f3f68;white-space:nowrap}
.estimate-row{gap:14px;align-items:center;flex-wrap:wrap}
.estimate-sum{font-size:30px;font-weight:900;min-width:240px;padding:0;color:#163a63;letter-spacing:.2px}
.estimate-row label{flex-direction:row;align-items:center;gap:10px;font-size:20px;font-weight:800;color:#334155}
.estimate input{font-size:26px;font-weight:800;min-height:54px;padding:8px 14px;border-radius:10px;width:165px;border:2px solid #6fa5dc;background:#fff}
#estimateCheck{min-height:54px;font-size:22px;font-weight:800;padding:10px 18px;border:2px solid #6fa5dc;background:#fff}
.estimate-feedback{grid-column:2;font-size:19px;font-weight:800;min-height:22px;margin-top:6px}

/* Legenda en footer naar de achtergrond */
.legend{margin-top:10px;padding:7px 10px;border-radius:8px;background:#f7f3e7;border:1px solid #ded4b5;font-size:12.5px;font-weight:700;color:#6b5b45}
.help{margin-top:8px;font-size:12px;color:#8a8f98;text-align:right}

@media(max-width:1200px){
  .estimate{grid-template-columns:1fr}.estimate-feedback{grid-column:1}.estimate-title{margin-bottom:5px}
}
@media(max-width:700px){
  #app{padding:12px}.valuebox{font-size:21px}.work-note{font-size:23px}.estimate-row label{flex-direction:column;align-items:flex-start}
}


/* === Interactieve oefenmodus voor de som onder elkaar === */
#practiceToggle.practice-on{
  background:#0f766e;
  border-color:#0f766e;
  color:#fff;
}
.column-sum .practice-cell{
  background:#ecfeff;
  outline:4px solid #0f766e;
  outline-offset:-2px;
}
.column-sum .exchange .practice-input,
.column-sum .resultcell .practice-input{
  cursor:text;
}
.column-sum .exchange:has(.practice-input),
.column-sum .resultcell:has(.practice-input){
  background:#f8fafc;
  outline:1px dashed #94a3b8;
  outline-offset:-3px;
}
.practice-input{
  width:72%;
  min-width:38px;
  max-width:72px;
  height:48px;
  min-height:48px;
  padding:2px 6px;
  box-sizing:border-box;
  border:3px solid #0f766e;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font:inherit;
  font-size:.78em;
  font-weight:900;
  text-align:center;
  box-shadow:0 0 0 4px rgba(15,118,110,.10);
}
.practice-input:focus{
  outline:3px solid rgba(15,118,110,.24);
  outline-offset:2px;
}
.practice-input.practice-wrong{
  border-color:#c62828;
  background:#ffebee;
}
.practice-input.practice-correct{
  border-color:#2e7d32;
  background:#e8f5e9;
}
.vertical-work.practice-mode{
  border-color:#76b7b1;
  box-shadow:0 2px 6px rgba(30,41,59,.08), inset 0 0 0 2px rgba(15,118,110,.08);
}
.vertical-work.practice-mode .vertical-work-title::after{
  content:" • zelf oefenen";
  color:#0f766e;
  font-size:.68em;
  font-weight:800;
}
@media(max-width:700px){
  .practice-input{height:40px;min-height:40px;max-width:54px}
}


/* V3: invoervakken altijd zichtbaar en klikbaar in Zelf oefenen */
.vertical-work.practice-mode .column-sum .exchange,
.vertical-work.practice-mode .column-sum .resultcell{
  min-height:62px;
  pointer-events:auto !important;
}
.vertical-work.practice-mode .practice-input{
  display:block !important;
  position:relative;
  z-index:20;
  pointer-events:auto !important;
  cursor:text !important;
  width:54px;
  height:54px;
  min-height:54px;
  padding:0;
  border:3px solid #0f766e;
  background:#ffffff;
  border-radius:9px;
  text-align:center;
  font-size:32px;
  font-weight:900;
}


/* V4: oefenmodus rustiger en losgekoppeld van de uitlegmodus */
.vertical-work.practice-mode .column-sum .exchange,
.vertical-work.practice-mode .column-sum .resultcell{
  outline:none;
  background:transparent;
}
.vertical-work.practice-mode .column-sum .practice-editable{
  background:#f8fafc;
  outline:1px dashed #94a3b8;
  outline-offset:-3px;
}
.vertical-work.practice-mode .practice-editable .practice-input{
  display:block;
  width:54px;
  height:54px;
  min-height:54px;
  padding:0;
  border:3px solid #0f766e;
  border-radius:9px;
  background:#fff;
  text-align:center;
  font-size:32px;
  font-weight:900;
  cursor:text;
}
.vertical-work.practice-mode .practice-editable .practice-input.practice-correct{
  border-color:#2e7d32;
  background:#e8f5e9;
}
.vertical-work.practice-mode .practice-editable .practice-input.practice-wrong{
  border-color:#c62828;
  background:#ffebee;
}


/* V5: oefenvakken worden nu door een aparte renderer opgebouwd */
.vertical-work.practice-mode .column-sum .practice-editable{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f8fafc !important;
  outline:1px dashed #94a3b8 !important;
  outline-offset:-3px;
  pointer-events:auto !important;
}
.vertical-work.practice-mode .column-sum .practice-editable .practice-input{
  display:block !important;
  position:relative;
  z-index:30;
  width:54px !important;
  height:54px !important;
  min-height:54px !important;
  padding:0 !important;
  border:3px solid #0f766e !important;
  border-radius:9px !important;
  background:#fff !important;
  color:#111827 !important;
  text-align:center;
  font-size:32px !important;
  font-weight:900 !important;
  line-height:1 !important;
  cursor:text !important;
  pointer-events:auto !important;
}
.vertical-work.practice-mode .column-sum .practice-editable .practice-input.practice-correct{
  border-color:#2e7d32 !important;
  background:#e8f5e9 !important;
}
.vertical-work.practice-mode .column-sum .practice-editable .practice-input.practice-wrong{
  border-color:#c62828 !important;
  background:#ffebee !important;
}


/* V6: antwoordvelden zijn altijd echte HTML-invoervelden */
.vertical-work.practice-mode .practice-input{
  -webkit-user-select:text !important;
  user-select:text !important;
  touch-action:manipulation;
  opacity:1 !important;
  visibility:visible !important;
}


/* V7: juiste tussenstappen bij lenen */
.vertical-work.practice-mode .practice-input.practice-intermediate{
  border-color:#2563eb !important;
  background:#eaf2ff !important;
}


/* V8: tijdens het typen geen foutkleur; feedback pas na een afgeronde invoer */
.vertical-work.practice-mode .practice-input:focus{
  border-color:#0f766e !important;
  background:#ffffff !important;
}


/* V9: in oefenmodus worden vervangen cijfers bij lenen direct doorgestreept */
.vertical-work.practice-mode .column-sum .borrow-replaced{
  text-decoration-line:line-through !important;
  text-decoration-thickness:7px !important;
  text-decoration-color:#ff0000 !important;
  text-decoration-skip-ink:none !important;
}


/* V15: duidelijke eindbevestiging wanneer de oefensom volledig klopt */
.vertical-work .work-note.practice-success{
  color:#166534 !important;
  background:#ecfdf3;
  border:2px solid #86efac;
  border-radius:12px;
  padding:12px 14px;
}


/* V18: in Zelf oefenen verschijnt uitleg alleen op verzoek */
.vertical-work.practice-mode .work-note:empty{
  min-height:0;
  margin-top:8px;
  padding:0;
}

</style>
</head>
<body>
<div id="app">
  <div class="controls">
    <button id="reset" type="button">Reset</button>
    <button id="random" type="button">Willekeurige som</button>
    <button id="practiceToggle" type="button" aria-pressed="false">Modus: Uitleg</button>
    <label class="level-label">Niveau
      <select id="level" aria-label="Niveau voor willekeurige som">
        <option value="A">A – Groep 5</option>
        <option value="B">B – Groep 6</option>
        <option value="C">C – Extreem</option>
      </select>
    </label>
    <div class="valuebox">Getal: <span id="total">0</span></div>
  </div>

  <form id="sumform" class="sumrow">
    <label>Eerste getal<input id="first" inputmode="numeric" value=""></label>
    <div class="operator" id="opview">+</div>
    <label>Tweede getal<input id="second" inputmode="numeric" value=""></label>
    <button type="submit">Leg uit</button>
  </form>

  <div class="controls">
    <button id="plus" type="button">Optellen</button>
    <button id="minus" type="button">Aftellen</button>
    <button id="back" type="button">← Stap terug</button>
    <button id="next" type="button">Volgende stap →</button>
  </div>

  <div class="main-stage">
    <div class="board">
      <div class="headings">
        <div class="heading">HD</div><div class="heading">TD</div><div class="heading">D</div>
        <div class="heading">H</div><div class="heading">T</div><div class="heading">E</div>
      </div>
      <div id="columns" class="columns"></div>
    </div>

    <div class="vertical-work" aria-live="polite">
      <div class="vertical-work-title">Som onder elkaar</div>
      <div class="place-row"><span>•</span><span>HD</span><span>TD</span><span>D</span><span>H</span><span>T</span><span>E</span></div>
      <div id="columnSum" class="column-sum"></div>
      <div id="workNote" class="work-note">Vul een som in en klik op Leg uit.</div>
    </div>
  </div>

  <div class="estimate">
    <div class="estimate-title">Schat eerst de uitkomst</div>
    <div class="estimate-row">
      <div id="estimateSum" class="estimate-sum">Vul eerst een som in.</div>
      <label>Geschat antwoord
        <input id="estimateAnswer" inputmode="numeric" aria-label="Geschat antwoord">
      </label>
      <button id="estimateCheck" type="button">Controle</button>
    </div>
    <div id="estimateFeedback" class="estimate-feedback" aria-live="polite"></div>
  </div>
  <div class="legend">HD = Honderdduizendtal &nbsp;|&nbsp; TD = Tienduizendtal &nbsp;|&nbsp; D = Duizendtal &nbsp;|&nbsp; H = Honderdtal &nbsp;|&nbsp; T = Tiental &nbsp;|&nbsp; E = Eenheid</div>
  <div class="help">
  © Bart Vermeulen | Gemaakt met ChatGPT
  &nbsp;|&nbsp;
  <a href="https://hits.sh/headwoofer.github.io/Telraam-20/" target="_blank" rel="noopener noreferrer" aria-label="Bekijk bezoekstatistieken">
    <img
      src="https://hits.sh/headwoofer.github.io/Telraam-20.svg?label=bezoeken&view=total"
      alt="Aantal bezoeken"
      style="vertical-align:middle;height:20px;border:0"
    >
  </a>
</div>
</div>

<script>
const labels=['E','T','H','D','TD','HD'];
const displayLabels=['HD','TD','D','H','T','E'];
const colors=[
  ['#ffd600','#fff59d'],
  ['#ef6c00','#ffb74d'],
  ['#7b1fa2','#ce93d8'],
  ['#c62828','#ef9a9a'],
  ['#1565c0','#64b5f6'],
  ['#2e7d32','#81c784']
];
const placeValues=[100000,10000,1000,100,10,1];
let values=[0,0,0,0,0,0], operator='+', steps=[], stepIndex=-1;

const el=id=>document.getElementById(id);
const columnsEl=el('columns'), totalEl=el('total');
const backBtn=el('back'), nextBtn=el('next');
const estimateSumEl=el('estimateSum'), estimateAnswerEl=el('estimateAnswer'), estimateCheckBtn=el('estimateCheck'), estimateFeedbackEl=el('estimateFeedback');
const columnSumEl=el('columnSum'), workNoteEl=el('workNote');
let estimateResult=null, currentA=0, currentB=0;

let practiceMode=false;
let practiceEntries={work:{},result:{}};
let practiceExpected={work:{},result:{}};
let practiceActions=[];
let practiceHelpIndex=-1;
let practiceHelpVisible=false;
let practiceHelpSnapshots=[];
let practiceHistory=[];
let practiceHistoryPos=-1;
let practiceRestoringHistory=false;
let practiceTimeline=[];
let practiceTimelinePos=0;

function roundForEstimate(n){
  if(n<10) return n;
  const digits=String(Math.floor(n)).length;
  // Balans voor hoofdrekenen: kleinere getallen grof op 1 betekenisvol cijfer,
  // grotere getallen op ongeveer 2 betekenisvolle cijfers.
  const keepDigits=digits>=5 ? 2 : 1;
  const unit=Math.pow(10,Math.max(0,digits-keepDigits));
  return Math.round(n/unit)*unit;
}
function updateEstimate(){
  if(el('first').value.trim()==='' || el('second').value.trim()===''){
    estimateSumEl.textContent='Vul eerst een som in.';
    estimateResult=null;
    estimateAnswerEl.classList.remove('correct','wrong');
    estimateFeedbackEl.textContent='';
    return;
  }
  const a=parseInput(el('first')), b=parseInput(el('second'));
  const ra=roundForEstimate(a), rb=roundForEstimate(b);
  estimateResult=operator==='+' ? ra+rb : ra-rb;
  estimateSumEl.textContent=ra.toLocaleString('nl-NL')+' '+(operator==='+'?'+':'−')+' '+rb.toLocaleString('nl-NL')+' =';
  estimateAnswerEl.classList.remove('correct','wrong');
  estimateFeedbackEl.textContent='';
}

function render(){
  columnsEl.innerHTML='';
  for(let col=0;col<6;col++){
    const wrap=document.createElement('div'); wrap.className='col';
    const rod=document.createElement('div'); rod.className='rod';
    const count=values[5-col];

    const top=document.createElement('div'); top.className='group';
    for(let n=19;n>=count;n--){
      const b=document.createElement('button');
      b.type='button'; b.className='bead inactive';
      b.style.background=n<10?colors[col][0]:colors[col][1];
      b.addEventListener('click',()=>{values[5-col]=n+1;render();});
      top.appendChild(b);
    }

    const spacer=document.createElement('div'); spacer.className='spacer';
    const bottom=document.createElement('div'); bottom.className='group';
    for(let n=count-1;n>=0;n--){
      const b=document.createElement('button');
      b.type='button'; b.className='bead active';
      b.style.background=n<10?colors[col][0]:colors[col][1];
      b.addEventListener('click',()=>{values[5-col]=n;render();});
      bottom.appendChild(b);
    }
    rod.append(top,spacer,bottom);

    const c=document.createElement('div'); c.className='count'; c.textContent=count;
    wrap.append(rod,c);
    columnsEl.appendChild(wrap);
  }
  let total=0;
  for(let p=0;p<6;p++) total+=values[p]*10**p;
  totalEl.textContent=total.toLocaleString('nl-NL');
}

function setFromNumber(num){
  num=Math.max(0,Math.min(999999,Math.floor(num)));
  values=[0,0,0,0,0,0];
  for(let p=0;p<6;p++) values[p]=Math.floor(num/10**p)%10;
}

function parseInput(input){
  const n=Number(input.value.replace(/\./g,'').replace(/[^0-9]/g,''));
  return Number.isFinite(n)?Math.max(0,Math.min(999999,n)):0;
}


function digitsOf(n){
  const raw=[];
  for(let p=5;p>=0;p--) raw.push(Math.floor(n/10**p)%10);
  let seen=false;
  return raw.map((d,i)=>{
    if(d!==0 || i===5) seen=true;
    return seen ? String(d) : '';
  });
}

function renderColumnSum(step=null){
  if(!columnSumEl) return;
  columnSumEl.innerHTML='';
  const aDigits=digitsOf(currentA), bDigits=digitsOf(currentB);
  const active=step && Number.isInteger(step.place) ? 5-step.place : -1;

  const add=(text, cls='cell')=>{const d=document.createElement('div');d.className=cls;d.textContent=text;columnSumEl.appendChild(d);};

  // Werkcijfers boven de som: alleen gewijzigde cijfers door lenen/inwisselen.
  const workDigits = step && step.workDigits ? step.workDigits : {};
  const activePlace = active>=0 ? 5-active : null;
  const hasActiveWorkDigit = activePlace!==null && Object.prototype.hasOwnProperty.call(workDigits,activePlace);
  const selectionMode = step && step.selectionMode ? step.selectionMode : 'calculate';

  const row=(op,digits,kind)=>{
    add(op,'cell opcell');
    digits.forEach((d,i)=>{
      let shouldHighlight=false;
      if(i===active){
        if(operator==='+'){
          // Bij optellen horen beide getallen én het bovenste onthoud-/inwisselvak bij de actieve kolom.
          shouldHighlight=true;
        }else if(selectionMode==='inspect'){
          // Tijdens het zoeken naar een donor bekijken we alleen het cijfer van het eerste getal.
          shouldHighlight=(kind==='a');
        }else if(selectionMode==='exchange'){
          // Tijdens het inwisselen markeren we de somcijfers niet; alleen het werkcijfer bovenaan krijgt nadruk.
          shouldHighlight=false;
        }else if(kind==='b'){
          // Tijdens het echte aftellen doet het onderste cijfer mee.
          shouldHighlight=true;
        }else if(kind==='a' && !hasActiveWorkDigit){
          // Zonder werkcijfer rekenen we middelste − onderste.
          shouldHighlight=true;
        }
        // Met een werkcijfer rekenen we bovenste werkcijfer − onderste cijfer.
      }
      // Bij aftellen blijft het oorspronkelijke cijfer zichtbaar, maar zodra het door
      // lenen/inwisselen is vervangen, strepen we het door. Zo is duidelijk dat de
      // actuele waarde voortaan in het bovenste werkvak staat.
      const place=5-i;
      const isBorrowReplaced = operator==='-' && kind==='a' &&
        Object.prototype.hasOwnProperty.call(workDigits,place) && d!=='';
      add(d, 'cell '+(shouldHighlight?'activeplace ':'')+
        (kind==='b'&&i===active?'changed ':'')+
        (isBorrowReplaced?'borrow-replaced':''));
    });
  };

  add('','cell');
  for(let i=0;i<6;i++){
    const place=5-i;
    const hasWork=Object.prototype.hasOwnProperty.call(workDigits,place);
    const t=hasWork ? String(workDigits[place]) : '';
    // Het bovenste vak licht alleen op als er echt een onthoud-/inwisselcijfer staat.
    // Bij de allereerste optelstap is dat vak dus nog neutraal.
    const highlightTop = i===active && hasWork && (operator==='+' || selectionMode!=='inspect');
    add(t,'cell exchange '+(highlightTop?'activeplace':''));
  }

  // De oorspronkelijke som blijft staan. De kleine werkcijfers erboven tonen het lenen.
  row('',aDigits,'a');
  row(operator==='+'?'+':'−',bDigits,'b');
  add('','cell'); for(let i=0;i<6;i++) add('','cell line');

  // Onder de streep komen uitsluitend cijfers die al echt uitgerekend zijn.
  add('','cell');
  const result = step && step.result ? step.result : {};
  for(let i=0;i<6;i++){
    const place=5-i;
    const d=Object.prototype.hasOwnProperty.call(result,place) ? String(result[place]) : '';
    add(d,'cell resultcell '+(i===active?'activeplace':''));
  }
  workNoteEl.textContent=(step&&step.workNote) ? step.workNote : 'De kleine cijfers bovenaan laten het lenen of inwisselen zien.';
}

function buildSteps(a,b){
  const out=[{value:a,place:null,workDigits:{},result:{},workNote:'We zetten eerst het eerste getal op het telraam.',text:'We zetten eerst '+a.toLocaleString('nl-NL')+' op het telraam.'}];

  if(operator==='+'){
    const work=[0,0,0,0,0,0];
    const addend=[0,0,0,0,0,0];
    const result={};
    for(let p=0;p<6;p++){
      work[p]=Math.floor(a/10**p)%10;
      addend[p]=Math.floor(b/10**p)%10;
    }

    // Bij optellen zijn de bovenste vakken uitsluitend voor onthouden/inwisselen.
    // Dus: nooit de volledige kolomsom (zoals 16, 15 of 12) en nooit het
    // resterende antwoordcijfer bovenaan tonen. Alleen de doorgeschoven 1.
    const carryDigits={};
    const currentCarryDigits=()=>({...carryDigits});

    for(let place=0;place<6;place++){
      const digit=addend[place];
      if(!digit) continue;
      const before=work[place];
      const sum=before+digit;
      out.push({values:[...work],place,workDigits:currentCarryDigits(),result:{...result},workNote:'We rekenen in deze kolom: '+before+' + '+digit+'.',text:'We beginnen bij '+labels[place]+': '+before+' + '+digit+' = '+sum+'.'});
      work[place]=sum;

      if(work[place]>=10 && place<5){
        // Eerst expliciet de te grote hoeveelheid op het telraam tonen,
        // terwijl boven de som alleen eerdere onthoudcijfers zichtbaar blijven.
        out.push({values:[...work],place,workDigits:currentCarryDigits(),result:{...result},workNote:work[place]+' '+labels[place]+' is te veel voor één kolom. Ik wissel 10 in.',text:'We hebben '+work[place]+' '+labels[place]+'. Ik wissel 10 '+labels[place]+' in voor 1 '+labels[place+1]+'.'});
        work[place]-=10;
        work[place+1]+=1;
        carryDigits[place+1]=1;
        result[place]=work[place];
        out.push({values:[...work],place,workDigits:currentCarryDigits(),result:{...result},workNote:'10 '+labels[place]+' worden 1 '+labels[place+1]+'. Het cijfer '+work[place]+' blijft in deze kolom.',text:'Na het inwisselen blijven '+work[place]+' '+labels[place]+' over en komt er 1 '+labels[place+1]+' bij.'});
      } else {
        result[place]=work[place];
        out.push({values:[...work],place,workDigits:currentCarryDigits(),result:{...result},workNote:before+' + '+digit+' = '+work[place]+'. Dit cijfer schrijven we onder de streep.',text:before+' + '+digit+' = '+work[place]+' bij '+labels[place]+'.'});
      }
    }

    let current=0;
    for(let p=0;p<6;p++) current+=work[p]*10**p;
    for(let p=0;p<6;p++) if(work[p]!==0 || p===0) result[p]=work[p];
    out.push({values:[...work],place:null,workDigits:{},result:{...result},workNote:'Dit is de uitkomst.',text:'Antwoord: '+current.toLocaleString('nl-NL')+'.'});
    return out;
  }

  const work=[0,0,0,0,0,0];
  const original=[0,0,0,0,0,0];
  const sub=[0,0,0,0,0,0];
  const result={};
  for(let p=0;p<6;p++){
    work[p]=Math.floor(a/10**p)%10;
    original[p]=work[p];
    sub[p]=Math.floor(b/10**p)%10;
  }

  // De bovenste vakken zijn uitsluitend voor leen-/inwisselnotatie.
  // Ze veranderen dus alleen wanneer er daadwerkelijk geleend wordt,
  // niet wanneer daarna de aftrekking in die kolom wordt uitgevoerd.
  let borrowDigits={};
  const currentBorrowDigits=()=>({...borrowDigits});
  // De bovenste vakken bewaren uitsluitend de leen-/inwisselnotatie.
  // Uitkomsten van de aftrekking mogen deze vakken nooit overschrijven.
  const recordExchange=(fromPlace,toPlace)=>{
    borrowDigits[fromPlace]=work[fromPlace];
    borrowDigits[toPlace]=work[toPlace];
  };

  for(let place=0;place<6;place++){
    const digit=sub[place];
    if(!digit && place>0 && !Object.keys(result).length) continue;
    if(!digit && work[place]===0) continue;
    const start=work[place];
    out.push({values:[...work],place,workDigits:currentBorrowDigits(),result:{...result},workNote:'Ik kijk naar '+labels[place]+': '+start+' − '+digit+'.',text:'We beginnen bij '+labels[place]+': '+start+' − '+digit+'.'});

    if(start<digit){
      let donor=place+1;
      while(donor<6 && work[donor]===0) donor++;
      if(donor<6){
        // Laat bij lege tussenkolommen eerst expliciet zien waarom we verder naar links moeten.
        // Voorbeeld 203 − 89 bij E: T is 0, dus eerst tonen dat we naar H moeten kijken,
        // vóórdat H daadwerkelijk wordt ingewisseld voor 10 T.
        if(donor>place+1){
          const emptyPlaces=[];
          for(let p=place+1;p<donor;p++) emptyPlaces.push(labels[p]);
          const emptyText=emptyPlaces.map(p=>p+' staat op 0').join(' en ');
          out.push({
            values:[...work],
            place:place+1,
            selectionMode:'inspect',
            workDigits:currentBorrowDigits(),
            result:{...result},
            workNote:start+' − '+digit+' kan niet. '+emptyText+', dus daar kunnen we niet lenen. We kijken één kolom verder naar links: '+labels[donor]+'.',
            text:start+' − '+digit+' kan niet. '+emptyText+', dus we gaan verder naar links naar '+labels[donor]+'.'
          });
        } else {
          out.push({values:[...work],place:donor,selectionMode:'inspect',workDigits:currentBorrowDigits(),result:{...result},workNote:start+' − '+digit+' kan niet. Ik leen 1 '+labels[donor]+'.',text:start+' − '+digit+' kan niet. Ik leen 1 '+labels[donor]+'.'});
        }
        while(donor>place){
          work[donor]-=1;
          work[donor-1]+=10;
          recordExchange(donor,donor-1);
          out.push({values:[...work],place:donor-1,selectionMode:'exchange',workDigits:currentBorrowDigits(),result:{...result},workNote:'1 '+labels[donor]+' wordt 10 '+labels[donor-1]+'.',text:'1 '+labels[donor]+' wordt 10 '+labels[donor-1]+'.'});
          donor--;
        }
        out.push({values:[...work],place,workDigits:currentBorrowDigits(),result:{...result},workNote:'Nu staat er '+work[place]+' bij '+labels[place]+'. Nu kan ik aftellen.',text:'Nu hebben we '+work[place]+' '+labels[place]+'.'});
      }
    }

    const before=work[place];
    work[place]-=digit;
    result[place]=work[place];
    out.push({values:[...work],place,workDigits:currentBorrowDigits(),result:{...result},workNote:before+' − '+digit+' = '+work[place]+'. Ik schrijf '+work[place]+' onder de streep.',text:before+' − '+digit+' = '+work[place]+' bij '+labels[place]+'.'});
  }

  // Zet ook onbewerkte hogere plaatsen in het eindantwoord.
  let current=0;
  for(let p=0;p<6;p++){
    current+=work[p]*10**p;
    if(work[p]!==0 || p===0) result[p]=work[p];
  }
  out.push({values:[...work],place:null,workDigits:currentBorrowDigits(),result:{...result},workNote:'Dit is de uitkomst.',text:'Antwoord: '+current.toLocaleString('nl-NL')+'.'});
  return out;
}



function buildPracticeExpected(){
  const expected={work:{},result:{}};

  if(operator==='+'){
    let carry=0;
    for(let place=0;place<6;place++){
      const aDigit=digitAtPlace(currentA,place);
      const bDigit=digitAtPlace(currentB,place);
      const total=aDigit+bDigit+carry;
      const resultDigit=total%10;
      const carryOut=Math.floor(total/10);

      expected.result[place]=resultDigit;
      if(carryOut && place<5){
        expected.work[place+1]=[carryOut];
      }
      carry=carryOut;
    }
    return expected;
  }

  // Bij aftellen bewaren we per werkvak alle geldige opeenvolgende leenstanden.
  for(const step of steps){
    const wd=step.workDigits||{};
    for(const [place,value] of Object.entries(wd)){
      const p=Number(place);
      if(!expected.work[p]) expected.work[p]=[];
      const n=Number(value);
      if(expected.work[p][expected.work[p].length-1]!==n){
        expected.work[p].push(n);
      }
    }
  }

  const finalStep=steps[steps.length-1]||{};
  const result=finalStep.result||{};
  for(const [place,value] of Object.entries(result)){
    expected.result[Number(place)]=Number(value);
  }

  return expected;
}

function placePlural(place){
  return ['eenheden','tientallen','honderdtallen','duizendtallen','tienduizendtallen','honderdduizendtallen'][place] || labels[place];
}

function digitAtPlace(n,place){
  return Math.floor(n/10**place)%10;
}

function buildPracticeActions(){
  if(operator==='+'){
    const actions=[];
    const workValues=[0,0,0,0,0,0];
    for(let p=0;p<6;p++) workValues[p]=digitAtPlace(currentA,p);

    let carry=0;
    for(let place=0;place<6;place++){
      const aDigit=digitAtPlace(currentA,place);
      const bDigit=digitAtPlace(currentB,place);
      const carryIn=carry;
      const total=aDigit+bDigit+carryIn;
      const resultDigit=total%10;
      const carryOut=Math.floor(total/10);

      const targets=[{kind:'result',place,expected:resultDigit}];

      if(carryOut && place<5){
        targets.push({kind:'work',place:place+1,expected:carryOut});
      }

      // Telraamstand na deze volledige kolomstap:
      // eerst de uitkomst in de huidige kolom, en de carry meteen door naar links.
      workValues[place]=resultDigit;
      if(place<5){
        workValues[place+1]=aDigitAtWorkPlace(place+1, workValues, currentA);
        if(carryOut) workValues[place+1]+=carryOut;
      }

      let calc='';
      if(carryIn){
        calc=aDigit+' + '+bDigit+' + '+carryIn+' = '+total+'. ';
      }else{
        calc=aDigit+' + '+bDigit+' = '+total+'. ';
      }

      let message=calc+'Ik schrijf '+resultDigit+' bij '+labels[place]+'.';
      if(carryOut && place<5){
        message+=' Ik onthoud '+carryOut+' bij '+labels[place+1]+'.';
      }

      actions.push({
        targets,
        message,
        stepIndex:place,
        step:{
          values:[...workValues],
          place,
          workNote:message
        },
        kind:'column'
      });

      carry=carryOut;

      // Stop zodra alle relevante hogere cijfers verwerkt zijn en er geen carry meer is.
      const higherA=Math.floor(currentA/10**(place+1));
      const higherB=Math.floor(currentB/10**(place+1));
      if(place>=0 && higherA===0 && higherB===0 && carry===0) break;
    }

    return actions;
  }

  const actions=[];
  let prevWork={};
  let prevResult={};

  steps.forEach((step,stepIndex)=>{
    const nowWork=step.workDigits||{};
    const nowResult=step.result||{};

    const changedWork=Object.keys(nowWork)
      .map(Number)
      .filter(p=>!Object.prototype.hasOwnProperty.call(prevWork,p) || Number(prevWork[p])!==Number(nowWork[p]))
      .sort((a,b)=>b-a)
      .map(p=>({
        kind:'work',
        place:p,
        expected:Number(nowWork[p]),
        before:Object.prototype.hasOwnProperty.call(prevWork,p)
          ? Number(prevWork[p])
          : digitAtPlace(currentA,p)
      }));

    if(changedWork.length){
      const rightmost=changedWork.reduce((m,t)=>Math.min(m,t.place),changedWork[0].place);
      const leftmost=changedWork.reduce((m,t)=>Math.max(m,t.place),changedWork[0].place);
      const left=changedWork.find(t=>t.place===leftmost);
      const right=changedWork.find(t=>t.place===rightmost);

      let message='Ik pas de werkcijfers aan.';
      if(changedWork.length>=2 && left && right){
        message='Ik leen 1 '+labels[left.place]+
          '. De '+left.before+' bij '+labels[left.place]+' wordt '+left.expected+
          ' en de '+right.before+' bij '+labels[right.place]+' wordt '+right.expected+'.';
      }

      actions.push({
        targets:changedWork,
        message,
        stepIndex,
        step,
        kind:'work'
      });
    }

    const changedResult=Object.keys(nowResult)
      .map(Number)
      .filter(p=>!Object.prototype.hasOwnProperty.call(prevResult,p) || Number(prevResult[p])!==Number(nowResult[p]))
      .sort((a,b)=>a-b)
      .map(p=>({kind:'result',place:p,expected:Number(nowResult[p])}));

    for(const target of changedResult){
      actions.push({
        targets:[target],
        message:'Ik schrijf '+target.expected+' bij '+labels[target.place]+'.',
        stepIndex,
        step,
        kind:'result'
      });
    }

    prevWork={...nowWork};
    prevResult={...nowResult};
  });

  return actions;
}

function aDigitAtWorkPlace(place,workValues,original){
  // Als deze hogere kolom nog niet eerder is verwerkt, start ik met het oorspronkelijke cijfer.
  // Is hij al verwerkt, dan staat de actuele waarde al in workValues.
  for(let p=0;p<place;p++){
    // lagere plaatsen zijn al verwerkt; hogere niet
  }
  return digitAtPlace(original,place);
}
function supportMessageForStep(step, action=null){
  if(!step) return action ? action.message : '';

  const note=(step.workNote||'').trim();

  if(operator==='-'){
    // 1. Eerst herkennen waarom ik moet lenen.
    const mCant=note.match(/(\d+)\s*−\s*(\d+)\s*kan niet/i);
    if(mCant){
      const place=Number.isInteger(step.place) ? step.place : 0;
      return mCant[1]+' − '+mCant[2]+' kan niet. Ik heb meer '+placePlural(place)+' nodig.';
    }

    // 2. Daarna precies laten zien wat het lenen met beide cijfers doet.
    if(action && action.kind==='work' && action.targets.length>=2){
      return action.message;
    }

    // 3. Na het inwisselen benoemen wat ik nu beschikbaar heb.
    const mNow=note.match(/Nu staat er\s+(\d+)\s+bij\s+([A-Z]+)/i);
    if(mNow){
      return 'Nu heb ik '+mNow[1]+' bij '+mNow[2]+'. Nu kan ik aftellen.';
    }

    // 4. Dan pas uitrekenen.
    const mCalc=note.match(/(\d+)\s*−\s*(\d+)\s*=\s*(\d+)/);
    if(mCalc){
      return mCalc[1]+' − '+mCalc[2]+' = '+mCalc[3]+'. Ik schrijf '+mCalc[3]+' op.';
    }

    // Een losse inwisselstap alleen tonen als er geen concretere leenactie beschikbaar is.
    const mExchange=note.match(/1\s+([A-Z]+)\s+wordt\s+10\s+([A-Z]+)/i);
    if(mExchange){
      return 'Ik wissel 1 '+mExchange[1]+' in voor 10 '+mExchange[2]+'.';
    }
  }

  if(operator==='+'){
    if(action && action.message) return action.message;
    return note;
  }

  if(action && action.message) return action.message;
  return note;
}

function isPracticeTargetCorrect(target){
  if(!Object.prototype.hasOwnProperty.call(practiceEntries[target.kind],target.place)) return false;
  return Number(practiceEntries[target.kind][target.place])===Number(target.expected);
}

function firstOpenPracticeAction(){
  return practiceActions.find(action=>!action.targets.every(isPracticeTargetCorrect)) || null;
}

function practiceCellIndex(kind, place){
  const visualIndex=5-Number(place); // HD..E
  return kind==='work' ? 1+visualIndex : 29+visualIndex;
}


function syncPracticeBorrowStrikes(){
  const firstCells=columnSumEl.querySelectorAll('[data-practice-first-place]');
  firstCells.forEach(cell=>{
    cell.classList.remove('borrow-replaced');

    if(!practiceMode || operator!=='-') return;

    const place=Number(cell.dataset.practiceFirstPlace);
    const expected=practiceExpected.work[place];
    const entered=practiceEntries.work[place];

    if(expected===undefined || entered===undefined) return;

    const validValues=Array.isArray(expected) ? expected.map(Number) : [Number(expected)];
    if(validValues.includes(Number(entered))){
      cell.classList.add('borrow-replaced');
    }
  });
}

function renderPracticeBoard(helpStep=null){
  columnSumEl.innerHTML='';

  const aDigits=digitsOf(currentA);
  const bDigits=digitsOf(currentB);
  const answer=operator==='+' ? currentA+currentB : currentA-currentB;
  const answerDigits=digitsOf(Math.max(0,answer));
  const active=helpStep && Number.isInteger(helpStep.place) ? 5-helpStep.place : -1;

  const add=(text, cls='cell')=>{
    const d=document.createElement('div');
    d.className=cls;
    d.textContent=text;
    columnSumEl.appendChild(d);
    return d;
  };

  const addInput=(cell,kind,place,expected)=>{
    cell.textContent='';
    cell.classList.add('practice-editable');

    const input=document.createElement('input');
    input.type='text';
    input.inputMode='numeric';
    input.pattern='[0-9]*';
    input.autocomplete='off';
    input.maxLength=2;
    input.className='practice-input';
    input.dataset.kind=kind;
    input.dataset.place=String(place);
    input.setAttribute('aria-label',(kind==='work'?'Werkcijfer':'Antwoordcijfer')+' bij '+labels[place]);

    const validValues=(kind==='work' && Array.isArray(expected)) ? expected.map(Number) : [Number(expected)];
    const saved=practiceEntries[kind][place];
    if(saved!==undefined){
      input.value=String(saved);
      const savedCorrect=validValues.includes(Number(saved));
      input.classList.toggle('practice-correct',savedCorrect);
      input.classList.toggle('practice-wrong',!savedCorrect);
    }

    const clean=()=>input.value.replace(/[^0-9]/g,'');

    const validateFinal=()=>{
      const raw=clean();
      input.value=raw;

      if(raw===''){
        delete practiceEntries[kind][place];
        input.classList.remove('practice-correct','practice-wrong','practice-intermediate');
        syncPracticeBorrowStrikes();
        updatePracticeFeedback(helpStep);
        return;
      }

      const entered=Number(raw);
      practiceEntries[kind][place]=entered;
      const correct=validValues.includes(entered);
      const intermediate=kind==='work' && Array.isArray(expected) &&
        correct && entered!==validValues[validValues.length-1];

      input.classList.toggle('practice-correct',correct);
      input.classList.toggle('practice-wrong',!correct);
      input.classList.toggle('practice-intermediate',intermediate);
      syncPracticeBorrowStrikes();
      updatePracticeFeedback(helpStep);
    };

    input.addEventListener('input',()=>{
      const raw=clean();
      input.value=raw;

      if(raw===''){
        delete practiceEntries[kind][place];
        input.classList.remove('practice-correct','practice-wrong','practice-intermediate');
        syncPracticeBorrowStrikes();
        updatePracticeFeedback(helpStep);
        return;
      }

      const entered=Number(raw);
      const exact=validValues.includes(entered);
      const prefix=validValues.some(v=>String(v).startsWith(raw) && String(v)!==raw);

      // Tijdens typen nooit rood kleuren. Een mogelijke eerste digit van 13 blijft dus neutraal.
      input.classList.remove('practice-wrong');

      if(exact){
        practiceEntries[kind][place]=entered;
        const intermediate=kind==='work' && Array.isArray(expected) &&
          entered!==validValues[validValues.length-1];
        input.classList.add('practice-correct');
        input.classList.toggle('practice-intermediate',intermediate);
        syncPracticeBorrowStrikes();
        updatePracticeFeedback(helpStep);
      }else{
        delete practiceEntries[kind][place];
        input.classList.remove('practice-correct','practice-intermediate');
        syncPracticeBorrowStrikes();
        if(prefix){
          workNoteEl.textContent='Ik typ het werkgetal verder in.';
        }
      }
    });

    input.addEventListener('blur',validateFinal);
    input.addEventListener('change',validateFinal);
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        validateFinal();
        input.blur();
      }
    });

    cell.appendChild(input);
  };

  // Bovenste werkcijfers: alleen echte onthoud-/leenvakken.
  add('','cell');
  for(let i=0;i<6;i++){
    const place=5-i;
    const cell=add('', 'cell exchange '+(i===active?'activeplace':''));
    if(Object.prototype.hasOwnProperty.call(practiceExpected.work,place)){
      addInput(cell,'work',place,practiceExpected.work[place]);
    }
  }

  // De twee vaste getallen.
  add('','cell opcell');
  aDigits.forEach((d,i)=>{
    const place=5-i;
    const cell=add(d,'cell '+(i===active?'activeplace':''));
    cell.dataset.practiceFirstPlace=String(place);
  });

  add(operator==='+'?'+':'−','cell opcell');
  bDigits.forEach((d,i)=>add(d,'cell '+(i===active?'activeplace':'')));

  // Streep.
  add('','cell');
  for(let i=0;i<6;i++) add('','cell line');

  // Antwoord: maak de invoervakken RECHTSTREEKS op basis van de uitkomst.
  // Daardoor zijn ze altijd aanwezig, ook als de uitlegstappen anders zijn opgebouwd.
  add('','cell');
  const firstAnswerIndex=answerDigits.findIndex(d=>d!=='');
  for(let i=0;i<6;i++){
    const place=5-i;
    const cell=add('', 'cell resultcell '+(i===active?'activeplace':''));
    if(i>=firstAnswerIndex){
      const expected=Math.floor(Math.max(0,answer)/10**place)%10;
      practiceExpected.result[place]=expected;
      addInput(cell,'result',place,expected);
    }
  }

  syncPracticeBorrowStrikes();
  updatePracticeFeedback(helpStep);
}


function isPracticeCompletelyCorrect(){
  // Alle uiteindelijke werkcijfers moeten ingevuld zijn en op hun laatste geldige stand staan.
  for(const [place,expected] of Object.entries(practiceExpected.work)){
    if(!Object.prototype.hasOwnProperty.call(practiceEntries.work,place)) return false;
    const valid=Array.isArray(expected) ? expected.map(Number) : [Number(expected)];
    const finalExpected=valid[valid.length-1];
    if(Number(practiceEntries.work[place])!==finalExpected) return false;
  }

  // Alle antwoordcijfers onder de streep moeten ingevuld en correct zijn.
  for(const [place,expected] of Object.entries(practiceExpected.result)){
    if(!Object.prototype.hasOwnProperty.call(practiceEntries.result,place)) return false;
    if(Number(practiceEntries.result[place])!==Number(expected)) return false;
  }

  return Object.keys(practiceExpected.result).length>0;
}


function buildCompletedPracticeHistory(){
  // Bouw een volledige terugkijktijdlijn, ook wanneer de leerling
  // de hele som zelf heeft ingevuld zonder eerder Stap vooruit te gebruiken.
  const history=[];

  let entries={work:{},result:{}};
  let stateValues=[0,0,0,0,0,0];
  for(let p=0;p<6;p++) stateValues[p]=digitAtPlace(currentA,p);

  history.push({
    entries:{work:{},result:{}},
    values:[...stateValues],
    helpIndex:-1,
    helpVisible:false,
    note:''
  });

  practiceActions.forEach((action,index)=>{
    action.targets.forEach(target=>{
      entries[target.kind][target.place]=Number(target.expected);
    });

    const step=action.step || steps[action.stepIndex] || null;
    if(step){
      if(step.values){
        stateValues=[...step.values];
      }else if(step.value!==undefined){
        stateValues=[0,0,0,0,0,0];
        const n=Math.max(0,Math.min(999999,Math.floor(step.value)));
        for(let p=0;p<6;p++) stateValues[p]=Math.floor(n/10**p)%10;
      }
    }

    history.push({
      entries:{
        work:{...entries.work},
        result:{...entries.result}
      },
      values:[...stateValues],
      helpIndex:index,
      helpVisible:true,
      note:supportMessageForStep(step,action)
    });
  });

  // De laatste toestand is de voltooide som.
  if(history.length){
    history[history.length-1].note='✓ Mijn som klopt helemaal!';
    history[history.length-1].helpVisible=false;
  }

  practiceHistory=history;
  practiceHistoryPos=history.length-1;
  practiceHelpIndex=practiceActions.length-1;
}

function updatePracticeFeedback(helpStep=null){
  if(practiceRestoringHistory) return;

  workNoteEl.classList.remove('practice-success');

  // Eerst alleen echte, afgeronde invoer als fout behandelen.
  const wrong=[];

  for(const [place,expected] of Object.entries(practiceExpected.work)){
    if(!Object.prototype.hasOwnProperty.call(practiceEntries.work,place)) continue;
    const valid=Array.isArray(expected) ? expected.map(Number) : [Number(expected)];
    const value=Number(practiceEntries.work[place]);
    if(!valid.includes(value)) wrong.push({kind:'work',place:Number(place)});
  }

  for(const [place,expected] of Object.entries(practiceExpected.result)){
    if(!Object.prototype.hasOwnProperty.call(practiceEntries.result,place)) continue;
    if(Number(practiceEntries.result[place])!==Number(expected)){
      wrong.push({kind:'result',place:Number(place)});
    }
  }

  if(isPracticeCompletelyCorrect()){
    workNoteEl.textContent='✓ Mijn som klopt helemaal!';
    workNoteEl.classList.add('practice-success');
    practiceHelpVisible=false;

    // De uitleg-tijdlijn bestaat los van de invoer. Na afronden zet ik de
    // positie op het einde, zodat Stap terug meteen door alle rekenstappen loopt.
    if(!practiceTimeline.length) buildPracticeTimeline();
    practiceTimelinePos=practiceTimeline.length-1;

    backBtn.disabled=practiceTimelinePos<=0;
    nextBtn.disabled=true;
    return;
  }

  // In Zelf oefenen blijft de blauwe uitleg stil zolang de leerling geen hulp vraagt.
  if(!practiceHelpVisible){
    workNoteEl.textContent='';
    return;
  }

  if(wrong.length){
    const t=wrong[0];
    workNoteEl.textContent='Ik kijk nog eens naar '+labels[t.place]+'.';
    return;
  }

  const open=firstOpenPracticeAction();

  if(!open){
    workNoteEl.textContent='';
    return;
  }

  if(helpStep){
    workNoteEl.textContent=supportMessageForStep(helpStep,open);
    return;
  }

  workNoteEl.textContent=open.message;
}
function preparePracticeFromInputs(){
  if(!practiceMode) return;

  if(el('first').value.trim()==='' || el('second').value.trim()===''){
    renderColumnSum();
    workNoteEl.textContent='Vul eerst beide getallen bovenaan in.';
    return;
  }

  const a=parseInput(el('first')), b=parseInput(el('second'));
  currentA=a; currentB=b;

  if(operator==='-' && b>a){
    renderColumnSum();
    workNoteEl.textContent='Bij aftellen moet het tweede getal kleiner of gelijk zijn aan het eerste.';
    return;
  }

  steps=buildSteps(a,b);
  practiceExpected=buildPracticeExpected();
  practiceExpected.result={};
  practiceActions=buildPracticeActions();
  buildPracticeTimeline();
  practiceHelpIndex=-1;
  practiceHelpVisible=false;
  practiceHelpSnapshots=[];
  resetPracticeHistory();
  practiceTimeline=[]; practiceTimelinePos=0;

  setFromNumber(a);
  render();

  // Start met de kale som. De uitleg wordt pas zichtbaar als de leerling om hulp vraagt.
  renderPracticeBoard(null);

  backBtn.disabled=true;
  nextBtn.disabled=practiceActions.length===0;
  nextBtn.textContent='Stap vooruit →';
  backBtn.textContent='← Stap terug';
}



function buildPracticeTimeline(){
  const timeline=[];

  let entries={work:{},result:{}};
  let stateValues=[0,0,0,0,0,0];
  for(let p=0;p<6;p++) stateValues[p]=digitAtPlace(currentA,p);

  // Stap 0 = helemaal kale som.
  timeline.push({
    entries:{work:{},result:{}},
    values:[...stateValues],
    helpIndex:-1,
    helpVisible:false,
    note:''
  });

  practiceActions.forEach((action,index)=>{
    action.targets.forEach(target=>{
      entries[target.kind][target.place]=Number(target.expected);
    });

    const step=action.step || steps[action.stepIndex] || null;
    if(step){
      if(step.values){
        stateValues=[...step.values];
      }else if(step.value!==undefined){
        stateValues=[0,0,0,0,0,0];
        const n=Math.max(0,Math.min(999999,Math.floor(step.value)));
        for(let p=0;p<6;p++) stateValues[p]=Math.floor(n/10**p)%10;
      }
    }

    timeline.push({
      entries:{
        work:{...entries.work},
        result:{...entries.result}
      },
      values:[...stateValues],
      helpIndex:index,
      helpVisible:true,
      note:supportMessageForStep(step,action)
    });
  });

  practiceTimeline=timeline;
  practiceTimelinePos=0;
}

function renderPracticeTimelinePosition(pos){
  if(!practiceTimeline.length) buildPracticeTimeline();
  practiceTimelinePos=Math.max(0,Math.min(pos,practiceTimeline.length-1));
  const state=practiceTimeline[practiceTimelinePos];

  practiceEntries={
    work:{...state.entries.work},
    result:{...state.entries.result}
  };
  values=[...state.values];
  practiceHelpIndex=state.helpIndex;
  practiceHelpVisible=state.helpVisible;

  render();

  let step=null;
  if(practiceHelpIndex>=0 && practiceActions[practiceHelpIndex]){
    const action=practiceActions[practiceHelpIndex];
    step=action.step || steps[action.stepIndex] || null;
  }

  practiceRestoringHistory=true;
  renderPracticeBoard(step);
  practiceRestoringHistory=false;

  workNoteEl.textContent=state.note;
  workNoteEl.classList.remove('practice-success');

  backBtn.disabled=practiceTimelinePos<=0;
  nextBtn.disabled=practiceTimelinePos>=practiceTimeline.length-1;
}

function clonePracticeEntries(){
  return {
    work:{...practiceEntries.work},
    result:{...practiceEntries.result}
  };
}

function capturePracticeState(){
  return {
    entries:clonePracticeEntries(),
    values:[...values],
    helpIndex:practiceHelpIndex,
    helpVisible:practiceHelpVisible,
    note:workNoteEl.textContent || ''
  };
}

function restorePracticeState(state){
  if(!state) return;

  practiceEntries={
    work:{...state.entries.work},
    result:{...state.entries.result}
  };
  values=[...state.values];
  practiceHelpIndex=state.helpIndex;
  practiceHelpVisible=state.helpVisible;

  render();

  let step=null;
  if(practiceHelpIndex>=0 && practiceActions[practiceHelpIndex]){
    const action=practiceActions[practiceHelpIndex];
    step=action.step || steps[action.stepIndex] || null;
  }

  // De rechterkant wordt uitsluitend uit de opgeslagen invoertoestand opgebouwd.
  // Tijdens herstellen mag updatePracticeFeedback de tijdlijn NIET opnieuw opbouwen.
  practiceRestoringHistory=true;
  renderPracticeBoard(step);
  practiceRestoringHistory=false;

  workNoteEl.textContent=state.note;
  workNoteEl.classList.toggle('practice-success',state.note==='✓ Mijn som klopt helemaal!');

  backBtn.disabled=practiceHistoryPos<=0;
  nextBtn.disabled=practiceHistoryPos>=practiceHistory.length-1 && 
    (practiceHelpIndex>=practiceActions.length-1 || practiceActions.length===0);
}

function resetPracticeHistory(){
  practiceHistory=[];
  practiceHistoryPos=-1;
}

function ensurePracticeHistoryBaseline(){
  if(practiceHistoryPos>=0) return;
  practiceHistory=[capturePracticeState()];
  practiceHistoryPos=0;
}

function stepPracticeHistoryBack(){
  if(practiceHistoryPos<=0) return;
  practiceHistoryPos--;
  restorePracticeState(practiceHistory[practiceHistoryPos]);
}

function stepPracticeHistoryForward(){
  if(practiceHistoryPos<0 || practiceHistoryPos>=practiceHistory.length-1) return false;
  practiceHistoryPos++;
  restorePracticeState(practiceHistory[practiceHistoryPos]);
  return true;
}



function showPracticeHelp(i){
  if(!practiceMode || !practiceActions.length) return;

  ensurePracticeHistoryBaseline();

  // Als ik eerst terug ben gegaan en daarna weer vooruit ga,
  // vervallen de oude toekomstige toestanden.
  if(practiceHistoryPos < practiceHistory.length-1){
    practiceHistory=practiceHistory.slice(0,practiceHistoryPos+1);
  }

  practiceHelpVisible=true;
  practiceHelpIndex=Math.max(0,Math.min(i,practiceActions.length-1));

  const action=practiceActions[practiceHelpIndex];
  const step=action.step || steps[action.stepIndex] || null;

  // Deze ene stap wordt voorgedaan.
  action.targets.forEach(target=>{
    practiceEntries[target.kind][target.place]=Number(target.expected);
  });

  // Telraam exact naar de toestand van deze stap.
  if(step){
    if(step.values) values=[...step.values];
    else if(step.value!==undefined) setFromNumber(step.value);
  }
  render();

  // Rechterkant volledig opnieuw opbouwen.
  renderPracticeBoard(step);

  // Tekst hoort ook bij deze toestand.
  workNoteEl.textContent=supportMessageForStep(step,action);

  // Sla daarna de COMPLETE toestand op.
  practiceHistory.push(capturePracticeState());
  practiceHistoryPos=practiceHistory.length-1;

  backBtn.disabled=practiceHistoryPos<=0;
  nextBtn.disabled=practiceHelpIndex>=practiceActions.length-1;
}

function showStep(i){
  if(!steps.length)return;
  stepIndex=Math.max(0,Math.min(i,steps.length-1));
  const step=steps[stepIndex];
  if(step.values) values=[...step.values]; else setFromNumber(step.value);
  backBtn.disabled=stepIndex<=0;
  nextBtn.disabled=stepIndex>=steps.length-1;
  backBtn.textContent='← Stap terug';
  nextBtn.textContent='Volgende stap →';
  render();
  renderColumnSum(step);
}

el('plus').addEventListener('click',()=>{operator='+';el('opview').textContent='+';updateEstimate();if(practiceMode)preparePracticeFromInputs();else renderColumnSum(steps[stepIndex]||null);});
el('minus').addEventListener('click',()=>{operator='-';el('opview').textContent='−';updateEstimate();if(practiceMode)preparePracticeFromInputs();else renderColumnSum(steps[stepIndex]||null);});
el('reset').addEventListener('click',()=>{practiceEntries={work:{},result:{}};practiceExpected={work:{},result:{}};practiceActions=[];practiceHelpIndex=-1;practiceHelpVisible=false;practiceHelpSnapshots=[];practiceHelpSnapshots=[];resetPracticeHistory();practiceTimeline=[];practiceTimelinePos=0;values=[0,0,0,0,0,0];steps=[];stepIndex=-1;currentA=0;currentB=0;render();renderColumnSum();backBtn.textContent='← Stap terug';nextBtn.textContent='Volgende stap →';workNoteEl.textContent=practiceMode?'Zelf oefenen staat aan. Vul een som in.':'Vul een som in en klik op Leg uit.';});
function randomInt(min,max){
  min=Math.ceil(min); max=Math.floor(max);
  return Math.floor(Math.random()*(max-min+1))+min;
}

function levelSettings(){
  const level=el('level').value;
  if(level==='A') return {minA:100,max:999,minB:10};         // Groep 5: rekenen tot 1.000
  if(level==='B') return {minA:1000,max:9999,minB:100};     // Groep 6: rekenen tot 10.000
  return {minA:10000,max:999999,minB:1000};                 // Extreem: volledige 6-cijferige ruimte
}

function makeRandomSum(){
  const cfg=levelSettings();
  let a,b;
  if(operator==='+'){
    // Houd genoeg ruimte over zodat de uitkomst binnen het telraam blijft.
    a=randomInt(cfg.minA,Math.max(cfg.minA,Math.floor(cfg.max*0.78)));
    const maxB=Math.max(cfg.minB,Math.min(cfg.max-a,Math.floor(cfg.max*0.45)));
    b=randomInt(cfg.minB,maxB);
  }else{
    a=randomInt(Math.max(cfg.minA,cfg.minB+1),cfg.max);
    // Bij aftellen is het tweede getal altijd kleiner dan het eerste.
    b=randomInt(cfg.minB,Math.max(cfg.minB,a-1));
  }

  el('first').value=String(a);
  el('second').value=String(b);
  currentA=a; currentB=b;
  steps=[]; stepIndex=-1;
  setFromNumber(a);
  backBtn.disabled=true; nextBtn.disabled=true;
  render();
  renderColumnSum();
  updateEstimate();
  estimateAnswerEl.value='';
  estimateAnswerEl.classList.remove('correct','wrong');
  estimateFeedbackEl.textContent='';
}

el('random').addEventListener('click',()=>{
  makeRandomSum();

  // In Zelf oefenen moet een nieuwe willekeurige som meteen
  // opnieuw de interactieve rechterkant opbouwen.
  if(practiceMode){
    practiceEntries={work:{},result:{}};
    practiceExpected={work:{},result:{}};
    practiceActions=[];
    practiceHelpIndex=-1;
    preparePracticeFromInputs();
  }
});

el('practiceToggle').addEventListener('click',()=>{
  practiceMode=!practiceMode;
  const btn=el('practiceToggle');
  btn.textContent=practiceMode ? 'Modus: Zelf oefenen' : 'Modus: Uitleg';
  btn.classList.toggle('practice-on',practiceMode);
  btn.setAttribute('aria-pressed',String(practiceMode));
  document.querySelector('.vertical-work')?.classList.toggle('practice-mode',practiceMode);

  practiceEntries={work:{},result:{}};
  practiceExpected={work:{},result:{}};
  practiceActions=[];
  practiceHelpIndex=-1;
  practiceHelpVisible=false;
  practiceHelpSnapshots=[];
  resetPracticeHistory();
  practiceTimeline=[]; practiceTimelinePos=0;

  if(practiceMode){
    preparePracticeFromInputs();
  }else{
    backBtn.textContent='← Stap terug';
    nextBtn.textContent='Volgende stap →';
    if(steps.length){
      stepIndex=0;
      showStep(0);
    }else{
      renderColumnSum();
      workNoteEl.textContent='Vul een som in en klik op Leg uit.';
    }
  }
});

el('sumform').addEventListener('submit',e=>{
  e.preventDefault();
  const a=parseInput(el('first')), b=parseInput(el('second'));
  currentA=a; currentB=b;
  practiceEntries={work:{},result:{}};

  if(operator==='-'&&b>a){
    workNoteEl.textContent='Bij aftellen moet het tweede getal kleiner of gelijk zijn aan het eerste.';
    return;
  }

  steps=buildSteps(a,b);

  if(practiceMode){
    practiceExpected=buildPracticeExpected();
    practiceActions=buildPracticeActions();
    buildPracticeTimeline();
    practiceExpected.result={};
    practiceHelpIndex=-1;
    practiceHelpVisible=false;
    practiceHelpSnapshots=[];
    resetPracticeHistory();
    practiceTimeline=[]; practiceTimelinePos=0;
    setFromNumber(a);
    render();
    renderPracticeBoard(null);
    backBtn.disabled=true;
    nextBtn.disabled=steps.length<=1;
    nextBtn.textContent='Stap vooruit →';
  }else{
    showStep(0);
  }
});

backBtn.addEventListener('click',()=>{
  if(practiceMode){
    if(!practiceTimeline.length) buildPracticeTimeline();
    if(practiceTimelinePos>0){
      renderPracticeTimelinePosition(practiceTimelinePos-1);
    }
  }else if(stepIndex>0){
    showStep(stepIndex-1);
  }
});
nextBtn.addEventListener('click',()=>{
  if(practiceMode){
    if(!practiceActions.length) return;

    if(!practiceTimeline.length){
      buildPracticeTimeline();

      // Als de leerling al zelf dingen heeft ingevuld, begin bij de eerste
      // uitlegstap. Vanaf dat moment is vooruit/terug een zuivere reken-tijdlijn.
      practiceTimelinePos=0;
    }

    if(practiceTimelinePos<practiceTimeline.length-1){
      renderPracticeTimelinePosition(practiceTimelinePos+1);
    }
  }else if(stepIndex<steps.length-1){
    showStep(stepIndex+1);
  }
});

el('first').addEventListener('input',()=>{updateEstimate(); if(practiceMode){practiceEntries={work:{},result:{}};preparePracticeFromInputs();}});
el('second').addEventListener('input',()=>{updateEstimate(); if(practiceMode){practiceEntries={work:{},result:{}};preparePracticeFromInputs();}});
estimateCheckBtn.addEventListener('click',()=>{
  if(estimateResult===null){estimateFeedbackEl.textContent='Vul eerst beide getallen in.';return;}
  const entered=Number(String(estimateAnswerEl.value).replace(/\./g,'').replace(/[^0-9-]/g,''));
  const correct=Number.isFinite(entered) && entered===estimateResult;
  estimateAnswerEl.classList.toggle('correct',correct);
  estimateAnswerEl.classList.toggle('wrong',!correct);
  estimateFeedbackEl.textContent=correct?'Goed geschat!':'Nog niet. Kijk nog eens naar de afgeronde som.';
});

backBtn.disabled=true;
nextBtn.disabled=true;
render();
renderColumnSum();
updateEstimate();
</script>
